name: Continuous Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

# Least privilege for the workflow token (nothing here needs to write to the repo)
permissions:
  contents: read

jobs:
  validate:
    name: Typecheck & Build Validation
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: testing-jwt-secret-with-at-least-32-characters
      ENCRYPTION_SECRET: testing-encryption-secret-with-at-least-32-characters
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript Compilation
        run: npm run lint

      - name: Run Hermetic Security Tests
        run: npm run test:security

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Hermetic Smoke Suite
        run: npm test

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to DigitalOcean Droplet
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Pull & Docker Rebuild
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/neogram
            echo "[:> CI/CD] Fetching latest commits from origin/main..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "[:> CI/CD] Rebuilding and launching Docker containers..."
            docker compose up -d --build

            echo "[:> CI/CD] Verifying container status..."
            docker compose ps

            echo "[:> CI/CD] Waiting for application to initialize..."
            HEALTHY=0
            for i in $(seq 1 15); do
              if curl -s -f http://127.0.0.1:4000/api/health > /dev/null 2>&1; then
                echo "[:> CI/CD] Server healthy on probe $i!"
                HEALTHY=1
                break
              fi
              echo "[:> CI/CD] Waiting for server response... ($i/15)"
              sleep 2
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "[:> CI/CD ERROR] Health check failed after 30 seconds!"
              docker compose logs --tail=50 app
              exit 1
            fi

            echo "[:> CI/CD] Deployment successful! Live at https://neogram.club"
