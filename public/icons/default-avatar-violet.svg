<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Retro 90s Dark Surface -->
  <rect width="128" height="128" fill="#110b1c" />
  
  <!-- CRT Monitor Bezel (Indigo Grey Computer) -->
  <rect x="14" y="14" width="100" height="80" rx="3" fill="#bcb8cc" stroke="#000000" stroke-width="3" />
  <rect x="18" y="18" width="92" height="72" rx="2" fill="#d0cce0" />
  
  <!-- CRT Screen (Sunken Violet Matrix) -->
  <rect x="24" y="24" width="80" height="60" rx="3" fill="#080512" stroke="#40384c" stroke-width="2" />
  
  <!-- Phosphor Scanlines -->
  <line x1="24" y1="36" x2="104" y2="36" stroke="#1d1033" stroke-width="1" />
  <line x1="24" y1="48" x2="104" y2="48" stroke="#1d1033" stroke-width="1" />
  <line x1="24" y1="60" x2="104" y2="60" stroke="#1d1033" stroke-width="1" />
  <line x1="24" y1="72" x2="104" y2="72" stroke="#1d1033" stroke-width="1" />
  
  <!-- Electric Violet Pixel Shades -->
  <rect x="36" y="38" width="22" height="14" fill="#b366ff" stroke="#000000" stroke-width="2" />
  <rect x="70" y="38" width="22" height="14" fill="#b366ff" stroke="#000000" stroke-width="2" />
  <rect x="58" y="42" width="12" height="4" fill="#b366ff" />
  
  <!-- Pixel Glare Reflection -->
  <rect x="38" y="40" width="6" height="4" fill="#ffffff" />
  <rect x="72" y="40" width="6" height="4" fill="#ffffff" />
  
  <!-- Retro Violet Phosphor Smile -->
  <rect x="44" y="64" width="6" height="4" fill="#b366ff" />
  <rect x="50" y="68" width="28" height="4" fill="#b366ff" />
  <rect x="78" y="64" width="6" height="4" fill="#b366ff" />
  
  <!-- Monitor Stand -->
  <polygon points="50,94 78,94 84,108 44,108" fill="#948ca4" stroke="#000000" stroke-width="2" />
  <rect x="34" y="108" width="60" height="8" rx="1" fill="#bcb8cc" stroke="#000000" stroke-width="2" />
  
  <!-- Power LED Indicator (Glowing Amber) -->
  <circle cx="98" cy="88" r="2" fill="#ffb000" />
</svg>

