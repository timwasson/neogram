services:
  postgres:
    image: postgres:16-alpine
    container_name: neogram_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neogram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neogram_secret}
      POSTGRES_DB: ${POSTGRES_DB:-neogram_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neogram} -d ${POSTGRES_DB:-neogram_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: neogram_postgres_data
