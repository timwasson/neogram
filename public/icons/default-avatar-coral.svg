<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Retro 90s Dark Surface -->
  <rect width="128" height="128" fill="#1c0b10" />
  
  <!-- CRT Monitor Bezel (Warm Titanium Computer) -->
  <rect x="14" y="14" width="100" height="80" rx="3" fill="#ccb8bc" stroke="#000000" stroke-width="3" />
  <rect x="18" y="18" width="92" height="72" rx="2" fill="#e0ccd0" />
  
  <!-- CRT Screen (Sunken Ruby Matrix) -->
  <rect x="24" y="24" width="80" height="60" rx="3" fill="#120508" stroke="#4c383c" stroke-width="2" />
  
  <!-- Phosphor Scanlines -->
  <line x1="24" y1="36" x2="104" y2="36" stroke="#330d16" stroke-width="1" />
  <line x1="24" y1="48" x2="104" y2="48" stroke="#330d16" stroke-width="1" />
  <line x1="24" y1="60" x2="104" y2="60" stroke="#330d16" stroke-width="1" />
  <line x1="24" y1="72" x2="104" y2="72" stroke="#330d16" stroke-width="1" />
  
  <!-- Arcade Coral Pixel Shades -->
  <rect x="36" y="38" width="22" height="14" fill="#ff4d6d" stroke="#000000" stroke-width="2" />
  <rect x="70" y="38" width="22" height="14" fill="#ff4d6d" stroke="#000000" stroke-width="2" />
  <rect x="58" y="42" width="12" height="4" fill="#ff4d6d" />
  
  <!-- Pixel Glare Reflection -->
  <rect x="38" y="40" width="6" height="4" fill="#ffffff" />
  <rect x="72" y="40" width="6" height="4" fill="#ffffff" />
  
  <!-- Retro Coral Phosphor Smile -->
  <rect x="44" y="64" width="6" height="4" fill="#ff4d6d" />
  <rect x="50" y="68" width="28" height="4" fill="#ff4d6d" />
  <rect x="78" y="64" width="6" height="4" fill="#ff4d6d" />
  
  <!-- Monitor Stand -->
  <polygon points="50,94 78,94 84,108 44,108" fill="#a48c90" stroke="#000000" stroke-width="2" />
  <rect x="34" y="108" width="60" height="8" rx="1" fill="#ccb8bc" stroke="#000000" stroke-width="2" />
  
  <!-- Power LED Indicator (Glowing Cyan) -->
  <circle cx="98" cy="88" r="2" fill="#00ffcc" />
</svg>

