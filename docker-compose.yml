services:
  app:
    build: .
    container_name: neogram_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-4000}:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:4000}
      DATABASE_URL: postgres://${POSTGRES_USER:-neogram}:${POSTGRES_PASSWORD:-neogram_secret}@postgres:5432/${POSTGRES_DB:-neogram_db}
      JWT_SECRET: ${JWT_SECRET:-neogram_retro_super_secret_jwt_key_1996}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-neogram_retro_aes256_vault_key_1996_master_secret}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: neogram_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neogram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neogram_secret}
      POSTGRES_DB: ${POSTGRES_DB:-neogram_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neogram} -d ${POSTGRES_DB:-neogram_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: neogram_postgres_data

