name: Continuous Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript Compilation
        run: npm run lint

  deploy:
    name: Deploy to DigitalOcean Droplet
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Pull & Docker Rebuild
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/neogram
            echo "[:> CI/CD] Pulling latest commits from origin/main..."
            git pull origin main

            echo "[:> CI/CD] Rebuilding and launching Docker containers..."
            docker compose up -d --build

            echo "[:> CI/CD] Verifying container status..."
            docker compose ps

            echo "[:> CI/CD] Probing local health endpoint..."
            sleep 3
            curl -f -s http://127.0.0.1:4000/api/health > /dev/null || (echo "[:> CI/CD ERROR] Health check failed!" && exit 1)

            echo "[:> CI/CD] Deployment successful! Live at https://neogram.club"
