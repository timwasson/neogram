<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- CRT Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="2" opacity="0.4" />
    </pattern>
    <!-- Phosphor Glow Filter -->
    <filter id="phosphorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark CRT Screen Surface -->
  <rect width="400" height="300" fill="#080b10" />

  <!-- CRT Vignette / Screen Frame -->
  <rect x="10" y="10" width="380" height="280" rx="6" fill="#0b1017" stroke="#1f2937" stroke-width="2" />

  <!-- Scanline Overlay -->
  <rect x="10" y="10" width="380" height="280" rx="6" fill="url(#scanlines)" />

  <!-- Corner Brackets (HUD Reticle) -->
  <path d="M 24 40 L 24 24 L 40 24" stroke="#00ff66" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 376 40 L 376 24 L 360 24" stroke="#00ff66" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 24 260 L 24 276 L 40 276" stroke="#00ff66" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 376 260 L 376 276 L 360 276" stroke="#00ff66" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Pixel-Art 90s Camera Icon -->
  <g transform="translate(160, 68)" stroke="#00ff66" fill="none" stroke-width="3" stroke-linecap="square" filter="url(#phosphorGlow)">
    <!-- Camera Body -->
    <rect x="8" y="16" width="64" height="46" rx="2" fill="#05120a" />
    <!-- Camera Viewfinder Bump -->
    <rect x="22" y="8" width="22" height="9" fill="#05120a" />
    <!-- Flash Unit -->
    <rect x="54" y="10" width="12" height="6" fill="#00ff66" />
    <!-- Outer Lens Circle -->
    <circle cx="40" cy="39" r="16" fill="#081e11" stroke-width="3" />
    <!-- Inner Lens Reflection -->
    <circle cx="40" cy="39" r="8" stroke-width="2" stroke-dasharray="4 2" />
    <circle cx="42" cy="37" r="3" fill="#00ff66" />
    <!-- Diagonal Broken Signal Line -->
    <line x1="14" y1="56" x2="66" y2="22" stroke="#ff3333" stroke-width="3" />
  </g>

  <!-- Status Pill Header -->
  <rect x="100" y="148" width="200" height="22" rx="2" fill="#05120a" stroke="#ff3333" stroke-width="1.5" />
  <text x="200" y="163" fill="#ff4444" font-family="Courier New, monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">
    ● NO_CARRIER // 404
  </text>

  <!-- Terminal Description Text -->
  <text x="200" y="196" fill="#00ff66" font-family="Courier New, monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="0.5" filter="url(#phosphorGlow)">
    [:&gt; MISSING BITMAP DETECTED]
  </text>
  <text x="200" y="218" fill="#8899a6" font-family="Courier New, monospace" font-size="10" text-anchor="middle">
    Static asset deleted or missing from host
  </text>

  <!-- Technical Telemetry Footer -->
  <text x="200" y="250" fill="#4b5563" font-family="Courier New, monospace" font-size="9" text-anchor="middle" letter-spacing="1">
    NEOGRAM V.90 // 28.8K PROTOCOL ERROR
  </text>
</svg>

