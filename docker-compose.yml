services:
  app:
    build: .
    container_name: neogram_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-4000}:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:4000}
      DATABASE_URL: postgres://${POSTGRES_USER:-neogram}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-neogram_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (>=32 chars) in .env}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set ENCRYPTION_SECRET (>=32 chars) in .env}
      ENCRYPTION_SECRET_PREVIOUS: ${ENCRYPTION_SECRET_PREVIOUS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    deploy:
      resources:
        limits:
          memory: 700M
    volumes:
      - static_galleries:/app/dist/static-galleries
      - public_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: neogram_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neogram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-neogram_db}
    # No host port is published: Postgres is reachable only on the private compose network.
    # (For local admin access use: docker compose exec postgres psql ...)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neogram} -d ${POSTGRES_DB:-neogram_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: neogram_postgres_data
  static_galleries:
    name: neogram_static_galleries
  public_uploads:
    name: neogram_public_uploads

